# XcodeGen spec for the Alfred app and its Share Extension.
# Generate with `xcodegen generate --spec ios/project.yml`; the .xcodeproj is not committed.
name: Alfred

options:
  deploymentTarget:
    iOS: "27.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  AlfredKit:
    path: AlfredKit

targets:
  Alfred:
    type: application
    platform: iOS
    sources:
      - path: Alfred
      - path: Shared
    dependencies:
      - package: AlfredKit
      - target: AlfredShare
    info:
      path: Alfred/Info.plist
      properties:
        CFBundleDisplayName: Alfred
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        UILaunchScreen: {}
        # The scanner in the pairing screen uses the camera.
        NSCameraUsageDescription: Alfred 用相机扫描配对二维码。
        # Lets the simulator reach a local Alfred over http on 127.0.0.1.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The keychain group the app shares with the Share Extension; the app reads it from here.
        AlfredKeychainAccessGroup: $(AppIdentifierPrefix)$(ALFRED_BUNDLE_ID)
        # The APNs gateway the app's device token belongs to. The owner installs a development-signed build, so its
        # aps-environment entitlement (Alfred.entitlements) is development too.
        AlfredAPNsEnvironment: development
    entitlements:
      path: Alfred/Alfred.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.$(ALFRED_BUNDLE_ID)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(ALFRED_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ALFRED_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"

  AlfredTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlfredTests
    dependencies:
      - target: Alfred
      - package: AlfredKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ALFRED_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  AlfredUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AlfredUITests
    dependencies:
      - target: Alfred
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ALFRED_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES

  AlfredShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AlfredShare
      - path: Shared
    dependencies:
      - package: AlfredKit
    info:
      path: AlfredShare/Info.plist
      properties:
        CFBundleDisplayName: Alfred
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        # The keychain group the extension reads the app's credentials from, the same one the app writes them to.
        AlfredKeychainAccessGroup: $(AppIdentifierPrefix)$(ALFRED_BUNDLE_ID)
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a, (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url") OR (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf") OR (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image")).@count == 1).@count == 1 AND extensionItems.@count == 1'
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    entitlements:
      path: AlfredShare/AlfredShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(ALFRED_BUNDLE_ID)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(ALFRED_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ALFRED_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Alfred:
    build:
      targets:
        Alfred: all
        AlfredShare: all
    test:
      targets:
        - AlfredTests
        - AlfredUITests
