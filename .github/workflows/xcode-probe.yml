name: Xcode probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label: [macos-latest, macos-26, macos-26-large, macos-26-xlarge, macos-15, macos-27]
    runs-on: ${{ matrix.label }}
    steps:
      - run: |
          echo "label=${{ matrix.label }}"
          sw_vers || true
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version || true
